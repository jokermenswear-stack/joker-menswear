    <!DOCTYPE html>
    <html>
    <head>
    <title>Manage Orders - Joker Menswear</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f5f5f5;
    }


    /* Header */

    .top-bar{

        display:flex;
        justify-content:space-between;
        align-items:center;
        background:#111;
        color:white;
        padding:18px 25px;

    }

    .top-bar h1{

        margin:0;
        font-size:24px;

    }


    /* Notification */

    #notificationBell{

        font-size:32px;
        cursor:pointer;
        position:relative;

    }


    #notificationCount{

        position:absolute;
        top:-8px;
        right:-10px;
        background:red;
        color:white;
        border-radius:50%;
        padding:3px 8px;
        font-size:13px;

    }



    /* Container */

    .order-container{

        padding:25px;

    }


    /* Table */


    table{

        width:100%;
        border-collapse:collapse;
        background:white;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 5px 20px rgba(0,0,0,0.1);

    }


    th{

        background:#222;
        color:white;
        padding:15px;
        text-align:left;

    }


    td{

        padding:14px;
        border-bottom:1px solid #eee;

    }


    tr:hover{

        background:#fafafa;

    }



    /* Status */

    .status-dropdown{

        padding:8px 12px;
        border:none;
        border-radius:20px;
        font-weight:bold;
        cursor:pointer;

    }



    /* Button */

    button{

        background:#111;
        color:white;
        border:none;
        padding:9px 18px;
        border-radius:20px;
        cursor:pointer;

    }


    button:hover{

        background:#444;

    }



    /* Mobile */

    @media(max-width:768px){


    .order-container{

        padding:10px;

    }


    table{

        display:block;
        overflow-x:auto;
        white-space:nowrap;

    }


    .top-bar h1{

        font-size:20px;

    }


    }

    </style>


    </head>


    <body>


    <div class="top-bar">

    <h1>🛒 Manage Orders</h1>


    <div id="notificationBell">

    🔔

    <span id="notificationCount">
    0
    </span>

    </div>


    </div>



    <div class="order-container">

    <button
        id="deleteSelectedBtn"
        style="background:red;color:white;margin-bottom:15px;">
        🗑 Delete Selected
    </button>

    <table>

    <thead>

    <tr>

    <th>
        <input type="checkbox" id="selectAll">
    </th>
    <th>Order ID</th>
    <th>Customer</th>
    <th>Phone</th>
    <th>Total</th>
    <th>Status</th>
    <th>Date</th>
    <th>Action</th>

    </tr>

    </thead>


    <tbody id="orderList">


    </tbody>


    </table>


    </div>



    <script src="/socket.io/socket.io.js"></script>

    <script src="orders.js"></script>


    </body>

    </html>
