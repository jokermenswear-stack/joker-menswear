<!DOCTYPE html>
<html>

<head>

<title>Edit Product - Joker Menswear</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>

<div id="header-container"></div>


<h1>Edit Product</h1>


<div class="admin-box">


<form id="editForm">


<input type="text" id="product_code" placeholder="Product Code">


<input type="text" id="product_name" placeholder="Product Name">


<input type="text" id="category" placeholder="Category">


<input type="text" id="brand" placeholder="Brand">


<input type="number" id="price" placeholder="Price">


<input type="number" id="stock" placeholder="Stock">


<input type="text" id="image" placeholder="Image Path">


<textarea id="description" placeholder="Description"></textarea>


<select id="status">

<option value="1">Show Product</option>

<option value="0">Hide Product</option>

</select>


<button type="submit">
Update Product
</button>


</form>


</div>


<script src="edit-product.js"></script>

<link rel="stylesheet" href="header.css">
<script src="header.js"></script>


</body>

</html>
