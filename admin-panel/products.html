<div class="container">

    <h1>Manage Products</h1>

    <div class="product-actions">

        <div class="left-actions">
            <button class="add-btn" onclick="location.href='add-product.html'">
                + Add New Product
            </button>

            <button class="delete-selected-btn" onclick="deleteSelectedProducts()">
                Delete Selected
            </button>
        </div>

        <div class="right-actions">
            <input type="file" id="excelFile" accept=".xlsx,.xls">

            <button class="upload-btn" onclick="uploadExcel()">
                Bulk Upload
            </button>
        </div>

    </div>

    <table>
        <thead>
            <tr>
                <th>
                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                </th>
                <th>ID</th>
                <th>Product Code</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="productList">
            <!-- Products will load here -->
        </tbody>

    </table>

</div>

<script src="products.js"></script>

<script>

    async function uploadExcel() {

        const fileInput = document.getElementById("excelFile");
        const file = fileInput.files[0];

        if (!file) {
            alert("Please select an Excel file");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {

          const response = await fetch("https://joker-menswear-backend.onrender.com/upload-products", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            alert(data.message);
            location.reload();

        } catch (error) {

            console.error(error);
            alert("Failed to upload products");

        }

    }

    function toggleSelectAll() {

        const selectAll = document.getElementById("selectAll");
        const checkboxes = document.querySelectorAll(".product-checkbox");

        checkboxes.forEach(cb => {
            cb.checked = selectAll.checked;
        });

    }

    async function deleteSelectedProducts() {

        const selected = document.querySelectorAll(".product-checkbox:checked");

        if (selected.length === 0) {
            alert("Please select at least one product");
            return;
        }

        if (!confirm("Delete selected products?")) return;

        for (let checkbox of selected) {

           await fetch(`https://joker-menswear-backend.onrender.com/products/${checkbox.value}`, {
    method: "DELETE"
});
        }

        alert("Selected products deleted successfully!");
        location.reload();

    }

</script>
