<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Status - Joker Menswear</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{

    background:white;
    width:90%;
    max-width:450px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);

}


h2{
    text-align:center;
}


.order-box{

    background:#fafafa;
    padding:15px;
    border-radius:10px;
    margin-top:15px;

}


.status{

    text-align:center;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;

}


.waiting{

    background:#fff3cd;
    color:#856404;

}


.confirmed{

    background:#d4edda;
    color:#155724;

}


.rejected{

    background:#f8d7da;
    color:#721c24;

}


.payment-box{

    display:none;
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;

}


input,button{

    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
    border-radius:6px;
    font-size:16px;

}


input{

    border:1px solid #ccc;

}


button{

    background:#111;
    color:white;
    border:none;
    cursor:pointer;

}


button:hover{

    background:#333;

}


.qr{

    text-align:center;

}


.qr img{

    width:220px;
    height:220px;
    object-fit:contain;
    border:1px solid #ddd;
    border-radius:10px;

}


.success{

    color:green;

}


.error{

    color:red;

}


</style>

</head>


<body>


<div class="container">


<h2>🛒 Joker Menswear</h2>


<div class="order-box">

<h3>Order Details</h3>

<p>
<strong>Order ID:</strong>
<span id="orderId"></span>
</p>


<p>
<strong>Customer:</strong>
<span id="customerName"></span>
</p>


<p>
<strong>Product:</strong>
<span id="productName"></span>
</p>


<p>
<strong>Total:</strong>
₹<span id="total"></span>
</p>


</div>



<div id="statusBox" class="status waiting">

🟡 Order Received<br><br>

Please wait while we verify product and size availability.<br>

Do not close this page.

</div>



<div id="paymentBox" class="payment-box">


<h3>✅ Order Confirmed</h3>


<p>
Your order is available. Please complete payment.
</p>


<div class="qr">

<img src="images/upi-qr.png">

</div>


<p>
<strong>UPI ID:</strong><br>
vyapar.172141824482@hdfcbank
</p>


<input 
type="text"
id="transactionId"
placeholder="Enter UTR / Transaction ID">


<button onclick="submitPayment()">

Submit Payment

</button>


</div>


</div>

<script>

const API = "https://joker-menswear.onrender.com";

const params = new URLSearchParams(window.location.search);

const orderId = params.get("orderId");

let currentOrderId = orderId;

let paymentSubmitted = false;
let paymentRejected = false;


// Load Order Details

function loadOrder(){


fetch(API + "/api/orders/" + orderId)

.then(res => res.json())

.then(data => {


console.log("Order Details:", data);


document.getElementById("orderId").innerText =
data.order.id;


document.getElementById("customerName").innerText =
data.order.customer_name;


document.getElementById("total").innerText =
data.order.total;


if(data.items.length > 0){

document.getElementById("productName").innerText =
data.items[0].product_name;

}


checkOrderStatus();


})

.catch(err=>{

console.log(err);

});

}



// Check Order Status

function checkOrderStatus(){


fetch(API + "/api/orders/" + orderId)

.then(res=>res.json())

.then(data=>{


const order = data.order;


const statusBox =
document.getElementById("statusBox");


if(order.status === "Confirmed"){

    if(paymentSubmitted){
        return;
    }

    statusBox.className =
    "status confirmed";

    statusBox.innerHTML =
    "✅ Order Confirmed<br><br>Please complete your payment.";

    document.getElementById("paymentBox").style.display =
    "block";

}

else if(order.status === "Cancelled"){

statusBox.className =
"status rejected";

statusBox.innerHTML =
"❌ Order Rejected<br><br><b>Reason:</b><br>" +
(order.rejection_reason || "No reason provided") +
"<br><br>Please contact Joker Menswear.";

}

else{


statusBox.className =
"status waiting";


statusBox.innerHTML =
"🟡 Order Received<br><br>Please wait while we verify product and size availability.<br><br>Do not close this page.";


}



});

}



// Submit Payment

function submitPayment(){


const transactionId =
document.getElementById("transactionId").value;



if(transactionId.trim()===""){

alert("Please enter UTR / Transaction ID");

return;

}



fetch(API + "/api/payment/submit",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

order_id:currentOrderId,

transaction_id:transactionId,

payment_method:"UPI"

})

})

.then(res=>res.json())

.then(data=>{


if(data.success){


paymentSubmitted = true;


document.getElementById("paymentBox").style.display =
"none";


document.getElementById("statusBox").className =
"status waiting";


document.getElementById("statusBox").innerHTML =

"🟡 Payment Submitted<br><br>Please wait while we verify your payment.";



}

else{


alert("Payment submission failed");

}


});


}



// Check payment status

function checkPaymentStatus(){


fetch(API + "/api/payment/status/" + orderId)

.then(res=>res.json())

.then(data=>{


if(data.payment_status==="Paid"){


document.getElementById("statusBox").className =
"status confirmed";


document.getElementById("statusBox").innerHTML =

"✅ Payment Verified<br><br>Your order has been confirmed.<br><br>We will begin packing your order shortly.";


}



if(data.payment_status==="Rejected"){

    paymentRejected = true;
    paymentSubmitted = false;

    document.getElementById("statusBox").className =
    "status rejected";

    document.getElementById("statusBox").innerHTML =

    "❌ Payment Rejected<br><br><b>Reason:</b><br>" +
    data.remarks +
    "<br><br>Please correct the payment details and submit again.";

    document.getElementById("paymentBox").style.display =
    "block";

}    
});


}



loadOrder();


// Auto check every 3 seconds

setInterval(() => {

    if (!paymentRejected) {
        checkOrderStatus();
    }

    checkPaymentStatus();

}, 3000);

</script>


</body>

</html>
